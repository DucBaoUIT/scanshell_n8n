services:
  n8n_ducbao:
    image: n8nio/n8n:${VERSION}

    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}

    restart: always

    ports:
      - ${HOST_IP}:${WEB_HTTP_PORT}:5678

    volumes:
      - ${APP_PATH}/data:/home/node/.n8n

    environment:
      N8N_SECURE_COOKIE: false
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}

      SCANNER_API_URL: http://scanner-api:8080
      SCANNER_API_TOKEN: ${SCANNER_API_TOKEN}

    labels:
      createdBy: "bt_apps"

    networks:
      - baota_net

  scanner-api:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      SCANNER_API_TOKEN: ${SCANNER_API_TOKEN}

    expose:
      - "8080"

    volumes:
      - /www/wwwroot:/www/wwwroot:ro
      - /opt/security-scanner:/opt/security-scanner:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

    read_only: true

    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev

    networks:
      - baota_net

networks:
  baota_net:
    external: true
