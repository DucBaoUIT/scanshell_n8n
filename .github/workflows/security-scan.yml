name: Security Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # Secret scanning
      # ============================================================
      - name: Check repository secrets
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking repository for accidentally committed secrets..."

          python3 <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(".")

          secret_patterns = [

              (
                  "Private key",
                  re.compile(
                      r"-----BEGIN (?:RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY-----"
                  ),
              ),

              (
                  "AWS access key",
                  re.compile(
                      r"\bAKIA[0-9A-Z]{16}\b"
                  ),
              ),

              (
                  "Discord webhook",
                  re.compile(
                      r"https://discord(?:app)?\.com/api/webhooks/[0-9]+/[A-Za-z0-9._-]+"
                  ),
              ),

              (
                  "Possible hard-coded API key",
                  re.compile(
                      r"""(?ix)
                      (?<![$\w])
                      (?:api[_-]?key|secret[_-]?key|access[_-]?key)
                      \s*
                      (?:=|:)
                      \s*
                      ["']
                      (?=
                          [A-Za-z0-9_./+=\-]{20,}
                          ["']
                      )
                      (?!change[_-]?me|example|placeholder|your[_-]?key|dummy|test|secret)
                      [A-Za-z0-9_./+=\-]{20,}
                      ["']
                      """
                  ),
              ),

              (
                  "Possible hard-coded password",
                  re.compile(
                      r"""(?ix)
                      (?<![$\w])
                      (?:password|passwd|pwd)
                      \s*
                      (?:=|:)
                      \s*
                      ["']
                      (?=
                          [A-Za-z0-9!@#%^&*()_+=\-{}\[\]:;,.?/]{12,}
                          ["']
                      )
                      (?!change[_-]?me|your[_-]?password|example|placeholder|password123|changeme|secret|test|dummy)
                      [A-Za-z0-9!@#%^&*()_+=\-{}\[\]:;,.?/]{12,}
                      ["']
                      """
                  ),
              ),
          ]

          excluded_dirs = {
              ".git",
              "data",
              "node_modules",
              "__pycache__",
              ".pytest_cache",
          }

          excluded_suffixes = {
              ".md",
              ".log",
              ".sqlite",
              ".sqlite-wal",
              ".sqlite-shm",
              ".pyc",
          }

          findings = []

          for path in root.rglob("*"):

              if not path.is_file():
                  continue

              if any(
                  part in excluded_dirs
                  for part in path.parts
              ):
                  continue

              if path.suffix.lower() in excluded_suffixes:
                  continue

              try:
                  text = path.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  )
              except Exception:
                  continue

              for name, pattern in secret_patterns:

                  if pattern.search(text):
                      findings.append(
                          (str(path), name)
                      )

          if findings:

              print()
              print(
                  "::error::Possible hard-coded secrets detected:"
              )
              print()

              for path, kind in findings:
                  print(
                      f" - {kind}: {path}"
                  )

              print()

              sys.exit(1)

          print(
              "No obvious hard-coded secrets detected."
          )
          PY


      # ============================================================
      # Shell syntax validation
      # ============================================================
      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating shell scripts..."

          bash -n scan-source.sh
          bash -n scan-database.sh

          echo "Shell syntax validation passed."


      # ============================================================
      # Python syntax validation
      # ============================================================
      - name: Validate Python
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating Python..."

          python3 -m py_compile scanner-api.py

          echo "Python syntax validation passed."


      # ============================================================
      # Install dependencies
      # ============================================================
      - name: Install scanner dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 --version

          if [ -f requirements.txt ]; then

            python3 -m pip install --upgrade pip

            python3 -m pip install \
              -r requirements.txt

          else

            echo "requirements.txt not found."
            echo "Skipping dependency installation."

          fi


      # ============================================================
      # Prepare clean test source
      # ============================================================
      - name: Prepare test source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ci-test-source

          mkdir -p ci-test-source

          cat > ci-test-source/test-clean.php <<'PHP'
          <?php

          function scanner_test_clean() {
              return 'clean';
          }
          PHP

          echo "Clean test source prepared."


      # ============================================================
      # Run source security scanner
      # ============================================================
      - name: Run source security scanner
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ci-reports

          mkdir -p ci-reports

          echo "Running source security scanner..."

          set +e

          bash scan-source.sh ci-test-source \
            > ci-reports/scan-source.json \
            2> ci-reports/scan-source.stderr

          EXIT_CODE=$?

          set -e

          if [ "${EXIT_CODE}" -ne 0 ]; then

            echo
            echo "======================================"
            echo "       SCANNER EXECUTION FAILED"
            echo "======================================"
            echo

            echo "Exit code: ${EXIT_CODE}"
            echo

            echo "----- Scanner stderr -----"

            if [ -s ci-reports/scan-source.stderr ]; then

              cat ci-reports/scan-source.stderr

            else

              echo "(scanner produced no stderr output)"

            fi

            echo

            echo "----- Scanner output -----"

            if [ -s ci-reports/scan-source.json ]; then

              cat ci-reports/scan-source.json

            else

              echo "(scanner produced no JSON output)"

            fi

            echo

            exit "${EXIT_CODE}"

          fi

          echo "Scanner executed successfully."

          python3 <<'PY'
          import json
          import sys

          report_path = "ci-reports/scan-source.json"

          try:

              with open(
                  report_path,
                  "r",
                  encoding="utf-8"
              ) as f:

                  data = json.load(f)

          except Exception as e:

              print(
                  "::error::Scanner did not produce valid JSON."
              )

              print(
                  f"JSON error: {e}"
              )

              print()
              print(
                  "----- Raw scanner output -----"
              )

              try:

                  with open(
                      report_path,
                      "r",
                      encoding="utf-8",
                      errors="replace"
                  ) as f:

                      print(f.read())

              except Exception:
                  pass

              sys.exit(1)


          print()
          print(
              "======================================"
          )
          print(
              "       SECURITY SCANNER RESULT"
          )
          print(
              "======================================"
          )
          print()

          print(
              "Scanner version :",
              data.get("version")
          )

          print(
              "Files scanned   :",
              data.get("files_scanned")
          )

          print(
              "Summary         :",
              data.get("summary")
          )


          summary = data.get(
              "summary",
              {}
          )

          critical = int(
              summary.get(
                  "critical",
                  0
              )
          )

          high = int(
              summary.get(
                  "high",
                  0
              )
          )

          medium = int(
              summary.get(
                  "medium",
                  0
              )
          )

          low = int(
              summary.get(
                  "low",
                  0
              )
          )


          print()
          print(
              "Critical :",
              critical
          )

          print(
              "High     :",
              high
          )

          print(
              "Medium   :",
              medium
          )

          print(
              "Low      :",
              low
          )

          print()


          if critical > 0:

              print(
                  "CRITICAL FINDINGS:"
              )

              print()

              findings = data.get(
                  "critical_findings",
                  []
              )

              for finding in findings:

                  filename = (
                      finding.get(
                          "relative_file"
                      )
                      or finding.get(
                          "file"
                      )
                      or "unknown"
                  )

                  print(
                      f" - {filename}"
                  )

              print()

              print(
                  "Security scan failed because "
                  "Critical findings were detected."
              )

              sys.exit(1)


          print(
              "No Critical findings detected."
          )

          print(
              "Security scan passed."
          )
          PY


      # ============================================================
      # Upload security report
      # ============================================================
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: ci-reports/
          retention-days: 14


      # ============================================================
      # Cleanup
      # ============================================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf ci-test-source
